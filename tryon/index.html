<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>ユニクロ・GU 試着ボード</title>
<style>
  /* 写真（上）→ 操作 → 商品棚（下）。広い画面では写真を左に固定し、商品棚を右に並べる */
  :root{
    --bg:#faf6f2; --card:#ffffff; --ink:#3b3330; --sub:#8a7d77; --line:#eadfd7;
    --accent:#b9786a; --accent-ink:#ffffff; --soft:#f3e9e2; --mark:#2f7d8c; --warn:#8a5a00; --warn-bg:#fff4dc;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#1e1a19; --card:#2a2523; --ink:#f1ebe7; --sub:#b3a6a0; --line:#3d3532;
      --accent:#d9978a; --accent-ink:#1e1a19; --soft:#342d2a; --mark:#6cc3d2; --warn:#f2c46b; --warn-bg:#3a2f18; color-scheme:dark}
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP",system-ui,sans-serif}
  .wrap{max-width:1120px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 48px max(16px,env(safe-area-inset-left));display:grid;gap:18px}
  @media(min-width:900px){.wrap{grid-template-columns:minmax(0,460px) minmax(0,1fr);align-items:start}
    .left{position:sticky;top:12px}}
  h1{font-size:20px;margin:4px 0 2px;letter-spacing:.04em}
  .lead{font-size:14px;color:var(--sub);margin:0;line-height:1.6}
  .left{display:grid;gap:12px;min-width:0}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:0 16px;
    border:none;border-radius:999px;font-size:15px;font-weight:700;background:var(--accent);color:var(--accent-ink);
    cursor:pointer;font-family:inherit;text-decoration:none}
  .btn.big{width:100%;min-height:56px;font-size:17px}
  .btn.sub{background:var(--card);color:var(--accent);border:2px solid var(--accent)}
  .btn.ghost{background:var(--soft);color:var(--ink);font-weight:500}
  .btn:disabled{opacity:.45}
  .btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--mark);outline-offset:2px}

  .stage{position:relative;width:100%;border-radius:14px;overflow:hidden;background:var(--soft);touch-action:none;user-select:none;-webkit-user-select:none}
  .stage img.photo{display:block;width:100%;height:auto;pointer-events:none}
  .empty{aspect-ratio:3/4;display:grid;place-items:center;text-align:center;color:var(--sub);font-size:15px;line-height:1.8;padding:24px}
  .layer{position:absolute;cursor:grab;touch-action:none}
  .layer img{display:block;width:100%;height:100%;pointer-events:none;object-fit:fill}
  .layer.sel{outline:2px dashed var(--accent);outline-offset:3px}
  .stage.marking .layer{pointer-events:none;opacity:.35}
  .stage.hide .layer{display:none}
  .mline{position:absolute;left:0;right:0;height:0;border-top:2px dashed var(--mark);pointer-events:none}
  .mline span{position:absolute;left:8px;top:-26px;background:var(--mark);color:#fff;font-size:12px;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .stage.hide .mline,.stage.clean .mline{display:none}

  .panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;gap:12px}
  .step{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .step .label{font-weight:700;font-size:15px}
  .done{color:var(--mark);font-weight:700}
  .hint{background:var(--warn-bg);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:14px;line-height:1.6}
  .field{display:flex;align-items:center;gap:8px}
  .field input{width:96px;min-height:44px;font-size:17px;padding:0 10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font-family:inherit}
  .row{display:flex;gap:8px;flex-wrap:wrap}
  .selinfo{display:grid;gap:8px}
  .selinfo .nm{font-size:14px;font-weight:700;line-height:1.5}
  .selinfo .meta{font-size:13px;color:var(--sub);line-height:1.6}
  .slider{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--sub)}
  .slider input{flex:1;min-width:0}

  .shelf{display:grid;gap:12px;min-width:0}
  .filters{display:flex;gap:8px;flex-wrap:wrap}
  .filters button{min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:14px;font-family:inherit;cursor:pointer}
  .filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;display:grid;gap:6px;align-content:start}
  .thumb{aspect-ratio:3/4;border-radius:8px;background:#f4f1ee;display:grid;place-items:center;overflow:hidden}
  .thumb img{max-width:92%;max-height:92%;object-fit:contain}
  .brand{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--sub)}
  .name{font-size:13px;line-height:1.45;min-height:2.9em}
  .price{font-size:13px;font-variant-numeric:tabular-nums}
  .tag{font-size:11px;color:var(--sub)}
  .colors{display:flex;gap:6px;flex-wrap:wrap}
  .colors button{width:30px;height:30px;padding:0;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:var(--soft);cursor:pointer}
  .colors button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--card) inset}
  .colors img{width:100%;height:100%;object-fit:cover;display:block}
  .card .btn{min-height:42px;font-size:14px}
  .card a{font-size:12px;color:var(--sub);text-align:center}
  .foot{font-size:12px;color:var(--sub);line-height:1.6}

  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:grid;place-items:center;padding:20px;z-index:50}
  .overlay .box{background:var(--card);border-radius:14px;padding:14px;max-width:440px;width:100%;display:grid;gap:10px;max-height:90vh;overflow:auto}
  .overlay img{width:100%;border-radius:10px}
  [hidden]{display:none!important}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="left">
    <div>
      <h1>ユニクロ・GU 試着ボード</h1>
      <p class="lead">お客さまの写真に、いま掲載中の商品を重ねて丈の目安を見られます。写真はこのスマホの中だけで使い、どこにも送られません。</p>
    </div>

    <div class="stage" id="stage">
      <div class="empty" id="empty">まず下の「写真を選ぶ」から<br>全身が写った写真を選んでください</div>
    </div>

    <div class="panel">
      <div class="step"><span class="label">作業1　写真</span>
        <label class="btn sub" for="file">写真を選ぶ</label>
        <input id="file" type="file" accept="image/*" hidden>
        <span class="done" id="okPhoto" hidden>✔</span></div>

      <div class="step"><span class="label">作業2　身長</span>
        <div class="field"><input id="height" type="number" inputmode="numeric" min="120" max="200" placeholder="158"><span>cm</span></div>
        <span class="done" id="okHeight" hidden>✔</span></div>

      <div class="step"><span class="label">作業3　頭とかかと</span>
        <button class="btn sub" id="markBtn" disabled>写真をタップして合わせる</button>
        <span class="done" id="okMark" hidden>✔</span></div>
      <div class="hint" id="guide" hidden></div>
    </div>

    <div class="panel selinfo" id="selPanel" hidden>
      <div class="nm" id="selName"></div>
      <div class="meta" id="selMeta"></div>
      <div class="slider"><label for="scale">大きさ</label><input id="scale" type="range" min="70" max="140" value="100"><span id="scaleVal">100%</span></div>
      <div class="row">
        <button class="btn ghost" id="resetBtn">丈の目安の位置に戻す</button>
        <button class="btn ghost" id="frontBtn">前に出す</button>
        <button class="btn ghost" id="delBtn">外す</button>
      </div>
    </div>

    <div class="row">
      <button class="btn ghost" id="cmpBtn">元の写真と比べる</button>
      <button class="btn ghost" id="clearBtn">全部外す</button>
      <button class="btn" id="saveBtn">画像を保存</button>
    </div>
  </div>

  <div class="shelf">
    <div class="filters" role="group" aria-label="ブランド">
      <button data-brand="all" aria-pressed="true">すべて</button>
      <button data-brand="UQ" aria-pressed="false">UNIQLO</button>
      <button data-brand="GU" aria-pressed="false">GU</button>
    </div>
    <div class="filters" role="group" aria-label="種類">
      <button data-kind="all" aria-pressed="true">すべて</button>
      <button data-kind="top" aria-pressed="false">トップス</button>
      <button data-kind="bottom" aria-pressed="false">ボトムス</button>
      <button data-kind="dress" aria-pressed="false">ワンピース</button>
    </div>
    <div class="grid" id="grid"><p class="foot">商品を読み込み中です…</p></div>
    <p class="foot" id="updated"></p>
    <p class="foot">丈の目安は、各商品のモデル着用写真（モデルの身長と着用サイズ）から計算しています。身幅のゆとりや体型による違いは再現できません。</p>
  </div>
</div>

<div class="overlay" id="saveOv" hidden>
  <div class="box">
    <img id="saveImg" alt="重ねた画像">
    <p class="foot">iPhoneは画像を長押しして「写真に保存」を選んでください。</p>
    <div class="row"><a class="btn" id="saveLink" download="tryon.jpg">ダウンロード</a><button class="btn ghost" id="closeOv">閉じる</button></div>
  </div>
</div>

<script>
const $=id=>document.getElementById(id);
const stage=$('stage');
const S={photo:null,photoW:0,photoH:0,heightCm:null,head:null,feet:null,mark:null,products:[],brand:'all',kind:'all',color:{},layers:[],active:null,z:10};
const DEFAULTS={top:{a:.17,h:.32},bottom:{a:.42,h:.53},dress:{a:.17,h:.6}};

/* ---------- products ---------- */
fetch('data/products.json?'+Date.now()).then(r=>r.json()).then(d=>{
  S.products=d.products||[];$('updated').textContent='商品データ：'+d.updated+' 時点（毎日自動で更新）';renderShelf();
}).catch(()=>{$('grid').innerHTML='<p class="foot">商品データを読み込めませんでした。時間をおいて開き直してください。</p>'});

function kindLabel(k){return k==='top'?'トップス':k==='bottom'?'ボトムス':'ワンピース'}
function renderShelf(){
  const g=$('grid');g.innerHTML='';
  const list=S.products.filter(p=>(S.brand==='all'||p.brand===S.brand)&&(S.kind==='all'||p.kind===S.kind));
  if(!list.length){g.innerHTML='<p class="foot">該当する商品がありません。</p>';return}
  list.forEach(p=>{
    const ci=S.color[p.id]||0,c=p.colors[ci];
    const d=document.createElement('div');d.className='card';
    d.innerHTML=`<div class="thumb"><img loading="lazy" alt=""></div>
      <div class="brand">${p.brandLabel}・${kindLabel(p.kind)}</div>
      <div class="name"></div>
      <div class="price">${p.price?'¥'+Number(p.price).toLocaleString():''}</div>
      <div class="tag">${p.meas?'丈の目安あり':'丈の目安なし（手で合わせる）'}</div>
      <div class="colors"></div>
      <button class="btn">着せる</button>
      <a target="_blank" rel="noopener">商品ページを見る</a>`;
    d.querySelector('.thumb img').src=c.img;
    d.querySelector('.name').textContent=p.name;
    d.querySelector('a').href=p.url;
    const cs=d.querySelector('.colors');
    p.colors.forEach((cc,i)=>{const b=document.createElement('button');b.setAttribute('aria-label','色 '+cc.code);b.setAttribute('aria-pressed',i===ci);
      const im=document.createElement('img');im.alt='';im.src=cc.chip;im.onerror=()=>im.remove();b.appendChild(im);
      b.onclick=()=>{S.color[p.id]=i;renderShelf()};cs.appendChild(b)});
    d.querySelector('.btn').onclick=()=>wear(p,ci);
    g.appendChild(d);
  });
}
document.querySelectorAll('[data-brand]').forEach(b=>b.onclick=()=>{S.brand=b.dataset.brand;document.querySelectorAll('[data-brand]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderShelf()});
document.querySelectorAll('[data-kind]').forEach(b=>b.onclick=()=>{S.kind=b.dataset.kind;document.querySelectorAll('[data-kind]').forEach(x=>x.setAttribute('aria-pressed',x===b));renderShelf()});

/* ---------- photo & calibration ---------- */
$('file').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const url=URL.createObjectURL(f);const im=new Image();
  im.onload=()=>{
    stage.querySelectorAll('.photo,.layer,.mline').forEach(n=>n.remove());$('empty').hidden=true;
    im.className='photo';im.alt='お客さまの写真';stage.prepend(im);
    S.photo=im;S.photoW=im.naturalWidth;S.photoH=im.naturalHeight;S.layers=[];S.head=S.feet=null;setActive(null);
    $('okPhoto').hidden=false;$('markBtn').disabled=false;startMark();
  };
  im.src=url;
};
$('height').oninput=()=>{const v=+$('height').value;S.heightCm=(v>=120&&v<=200)?v:null;$('okHeight').hidden=!S.heightCm;relayout();updateGuide()};
$('markBtn').onclick=startMark;
function startMark(){S.mark='head';S.head=S.feet=null;drawLines();stage.classList.add('marking');updateGuide()}
function updateGuide(){
  const g=$('guide');let t='';
  if(S.mark==='head')t='写真の「頭のてっぺん（髪の一番上）」をタップしてください。';
  else if(S.mark==='feet')t='次に「かかと（靴の底）」をタップしてください。';
  else if(S.photo&&!S.heightCm)t='身長を入力すると、丈の位置が合います。';
  g.textContent=t;g.hidden=!t;$('okMark').hidden=!(S.head!=null&&S.feet!=null);
}
function stagePoint(e){const r=stage.getBoundingClientRect();return{x:(e.clientX-r.left)/r.width,y:(e.clientY-r.top)/r.height}}
stage.addEventListener('pointerdown',e=>{
  if(!S.photo||!S.mark)return;const p=stagePoint(e);
  if(S.mark==='head'){S.head=p;S.mark='feet'}
  else{ if(p.y<=S.head.y+.1){updateGuide();return} S.feet=p;S.mark=null;stage.classList.remove('marking');relayout()}
  drawLines();updateGuide();
});
function drawLines(){
  stage.querySelectorAll('.mline').forEach(n=>n.remove());
  [['head','頭のてっぺん'],['feet','かかと']].forEach(([k,l])=>{if(!S[k])return;const d=document.createElement('div');d.className='mline';d.style.top=(S[k].y*100)+'%';d.innerHTML=`<span>${l}</span>`;stage.appendChild(d)});
}

/* ---------- layers ---------- */
function ready(){return S.photo&&S.head&&S.feet}
function wear(p,ci){
  if(!S.photo){alertGuide('先に「写真を選ぶ」から写真を選んでください。');return}
  if(!ready()){alertGuide('先に頭のてっぺんとかかとをタップしてください。');return}
  const c=p.colors[ci];
  const conflicts=p.kind==='dress'?['top','bottom','dress']:[p.kind,'dress'];
  S.layers.filter(L=>conflicts.includes(L.p.kind)).forEach(removeLayer);
  const el=document.createElement('div');el.className='layer';
  const img=new Image();img.alt='';img.src=c.img;
  const L={p,c,el,img,dx:0,dy:0,scale:1,ar:1};
  img.onload=()=>{L.ar=img.naturalWidth/img.naturalHeight;place(L)};
  el.appendChild(img);stage.appendChild(el);
  el.style.zIndex=p.kind==='bottom'?(S.z+=1):(S.z+=2);
  S.layers.push(L);bind(L);setActive(L);place(L);
  if(innerWidth<900)stage.scrollIntoView({behavior:'smooth',block:'start'});
}
function alertGuide(t){const g=$('guide');g.textContent=t;g.hidden=false;g.scrollIntoView({behavior:'smooth',block:'center'})}

function geometry(L){
  const p=L.p,body=S.feet.y-S.head.y; // stage-height fraction
  const heightCm=S.heightCm||158;
  const perCm=body/heightCm;
  let top,h;
  if(p.meas&&p.modelCm){
    const m=p.meas,anchor=p.kind==='bottom'?Math.min(m.topFrac,.42):m.topFrac;
    const lenCm=(m.hemFrac-anchor)*p.modelCm;
    const hem=S.head.y+anchor*body+lenCm*perCm;
    if(L.c.src==='model'){h=(m.hemFrac-m.topFrac)*p.modelCm*perCm;top=hem-h}
    else{top=S.head.y+anchor*body;h=hem-top}
  }else{const d=DEFAULTS[p.kind];top=S.head.y+d.a*body;h=d.h*body}
  return{top,h};
}
function place(L){
  if(!ready())return;
  const g=geometry(L),r=S.photoH/S.photoW;
  const h=g.h*L.scale, w=h*L.ar*r; // width as fraction of stage width
  const cx=S.head.x+L.dx, top=g.top+L.dy;
  Object.assign(L.el.style,{left:((cx-w/2)*100)+'%',top:(top*100)+'%',width:(w*100)+'%',height:(h*100)+'%'});
}
function relayout(){S.layers.forEach(place)}
function setActive(L){
  S.active=L;S.layers.forEach(x=>x.el.classList.toggle('sel',x===L));$('selPanel').hidden=!L;if(!L)return;
  $('selName').textContent=L.p.brandLabel+'　'+L.p.name;
  $('selMeta').textContent=L.p.meas?`丈はモデル（身長${L.p.modelCm}cm${L.p.modelSize?'・'+L.p.modelSize+'サイズ着用':''}）の写真から計算しています。`+(S.heightCm?'':'身長が未入力のため158cmで計算中です。'):'この商品はモデル写真から丈を測れなかったため、おおよその位置に置いています。指で動かして合わせてください。';
  $('scale').value=Math.round(L.scale*100);$('scaleVal').textContent=Math.round(L.scale*100)+'%';
}
function removeLayer(L){L.el.remove();S.layers=S.layers.filter(x=>x!==L);if(S.active===L)setActive(null)}
function bind(L){
  const pts=new Map();let st=null;
  const snap=()=>{const v=[...pts.values()];st={v,dx:L.dx,dy:L.dy,scale:L.scale,d:v.length>1?Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y):1}};
  L.el.addEventListener('pointerdown',e=>{e.stopPropagation();L.el.setPointerCapture(e.pointerId);pts.set(e.pointerId,{x:e.clientX,y:e.clientY});setActive(L);snap()});
  L.el.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=stage.getBoundingClientRect(),v=[...pts.values()];
    if(v.length===1&&st.v.length===1){L.dx=st.dx+(v[0].x-st.v[0].x)/r.width;L.dy=st.dy+(v[0].y-st.v[0].y)/r.height}
    else if(v.length>1&&st.v.length>1){L.scale=Math.max(.5,Math.min(1.8,st.scale*Math.hypot(v[0].x-v[1].x,v[0].y-v[1].y)/st.d));$('scale').value=Math.round(L.scale*100);$('scaleVal').textContent=Math.round(L.scale*100)+'%'}
    place(L)});
  const end=e=>{pts.delete(e.pointerId);snap()};
  L.el.addEventListener('pointerup',end);L.el.addEventListener('pointercancel',end);
}
$('scale').oninput=()=>{if(!S.active)return;S.active.scale=$('scale').value/100;$('scaleVal').textContent=$('scale').value+'%';place(S.active)};
$('resetBtn').onclick=()=>{const L=S.active;if(!L)return;L.dx=L.dy=0;L.scale=1;setActive(L);place(L)};
$('frontBtn').onclick=()=>{if(S.active)S.active.el.style.zIndex=(S.z+=1)};
$('delBtn').onclick=()=>{if(S.active)removeLayer(S.active)};
$('clearBtn').onclick=()=>[...S.layers].forEach(removeLayer);
$('cmpBtn').onclick=()=>{const on=stage.classList.toggle('hide');$('cmpBtn').textContent=on?'重ねた服を表示する':'元の写真と比べる'};

/* ---------- save ---------- */
$('saveBtn').onclick=()=>{
  if(!S.photo){alertGuide('先に写真を選んでください。');return}
  const W=S.photoW,H=S.photoH,cv=document.createElement('canvas');cv.width=W;cv.height=H;const cx=cv.getContext('2d');
  cx.drawImage(S.photo,0,0,W,H);
  [...S.layers].sort((a,b)=>(+a.el.style.zIndex)-(+b.el.style.zIndex)).forEach(L=>{
    const s=L.el.style;cx.drawImage(L.img,parseFloat(s.left)/100*W,parseFloat(s.top)/100*H,parseFloat(s.width)/100*W,parseFloat(s.height)/100*H)});
  cv.toBlob(b=>{const u=URL.createObjectURL(b);$('saveImg').src=u;$('saveLink').href=u;$('saveOv').hidden=false},'image/jpeg',.9);
};
$('closeOv').onclick=()=>$('saveOv').hidden=true;
</script>
</body>
</html>
